# The Xymon API, xymonapi(8), through the web server: for laptops and other
# machines, which must not reach port 1986 itself. Include this file where
# xymon-apache.conf is included, in the HTTPS virtual host, and enable
# mod_proxy and mod_proxy_http (a2enmod proxy proxy_http on Debian).
#
# The API keeps checking the password itself when XYMONAPI_PASSWD is set, so
# nothing here needs a password: Apache carries the Authorization header
# through. Over plain HTTP that header crosses the network in the clear;
# SSLRequireSSL below keeps this location to HTTPS. Where the Xymon pages
# themselves are served over plain HTTP, on a trusted network, remove it
# and the X-Forwarded-Proto line.
<Location "/xymon/api/">
    ProxyPass        "http://127.0.0.1:1986/xymon/api/"
    ProxyPassReverse "http://127.0.0.1:1986/xymon/api/"
    <IfModule mod_ssl.c>
        SSLRequireSSL
    </IfModule>
    # So that /client writes https:// addresses: the API itself sees http.
    <IfModule mod_headers.c>
        RequestHeader set X-Forwarded-Proto "https"
    </IfModule>
</Location>
