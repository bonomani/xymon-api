# The Xymon API, xymonapi(8), through lighttpd: for laptops and other
# machines, which must not reach port 1986 itself. Include this file in the
# configuration that serves the Xymon pages, with mod_proxy enabled, in the
# HTTPS part where there is one.
#
# The API keeps checking the password itself when XYMONAPI_PASSWD is set,
# and lighttpd carries the Authorization header through; it sets
# X-Forwarded-Proto itself, so /client writes the right address.
$HTTP["url"] =~ "^/xymon/api/" {
    proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 1986 ) ) )
    proxy.header = ( "upgrade" => "disable" )
}
