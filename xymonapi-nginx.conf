# The Xymon API, xymonapi(8), through nginx: for laptops and other machines,
# which must not reach port 1986 itself. Include this file in the server
# block that serves the Xymon pages, the HTTPS one where there is one.
#
# The API keeps checking the password itself when XYMONAPI_PASSWD is set,
# and nginx carries the Authorization header through. The two headers tell
# the API the address clients use, so that /client writes it.
location /xymon/api/ {
    proxy_pass http://127.0.0.1:1986/xymon/api/;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
